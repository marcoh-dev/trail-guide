info:
  name: Get all trails
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/trails"
  params:
    - name: difficulty
      value: easy
      type: query
      disabled: true
    - name: difficulty
      value: xyz
      type: query
      disabled: true
    - name: region
      value: bavarian-alps
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
